<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OTOP Digital Seller Activation</title><meta name="description" content="OTOP Digital Seller Activation proposal: Stage 1 Shopee Seller Activation, Stage 2 OTOP FastPage, Stage 3 OTOP E-Commerce + HERO PAY."><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f8fb}iframe{display:block;width:100%;height:100dvh;border:0}</style></head><body><iframe id="deck" src="./original.html" title="OTOP Digital Seller Activation Proposal"></iframe><script>const f=document.getElementById('deck');f.addEventListener('load',()=>{try{const d=f.contentDocument;const w=d.createTreeWalker(d.body,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){let s=n.nodeValue;if(!s||!s.includes('Stage '))continue;s=s.replaceAll('Stage 0','__STAGE_ZERO__').replaceAll('Stage 1','__STAGE_ONE__').replaceAll('Stage 2','__STAGE_TWO__');s=s.replaceAll('__STAGE_ZERO__','Stage 1').replaceAll('__STAGE_ONE__','Stage 2').replaceAll('__STAGE_TWO__','Stage 3');n.nodeValue=s;}d.title='OTOP Digital Seller Activation — Stage 1–2–3';}catch(e){console.error(e)}});</script></body></html>
