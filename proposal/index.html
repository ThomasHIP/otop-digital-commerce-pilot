<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>OTOP Digital Seller Activation</title><meta name="description" content="OTOP Digital Seller Activation proposal: Stage 1 Shopee Seller Activation, Stage 2 OTOP FastPage, Stage 3 OTOP E-Commerce + HERO PAY."><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f8fb}iframe{display:block;width:100%;height:100dvh;border:0}</style></head><body><iframe id="deck" src="./original.html" title="OTOP Digital Seller Activation Proposal"></iframe><script>
const f=document.getElementById('deck');
f.addEventListener('load',()=>{try{
 const d=f.contentDocument;
 const w=d.createTreeWalker(d.body,NodeFilter.SHOW_TEXT);let n;
 while(n=w.nextNode()){let s=n.nodeValue;if(!s||!s.includes('Stage '))continue;s=s.replaceAll('Stage 0','__S0__').replaceAll('Stage 1','__S1__').replaceAll('Stage 2','__S2__');n.nodeValue=s.replaceAll('__S0__','Stage 1').replaceAll('__S1__','Stage 2').replaceAll('__S2__','Stage 3');}
 d.title='OTOP Digital Seller Activation — Stage 1–2–3';
 const st=d.createElement('style');st.textContent=`
 .brand{grid-template-columns:48px 1px minmax(0,1fr) auto!important;gap:8px!important;align-items:center!important}.otop{width:48px!important;height:48px!important}.v{height:36px!important}.brand>.bt{font-size:15px!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}.brand>.pow{font-size:9px!important;margin:0!important;white-space:nowrap!important}.brand .tag{display:none!important}.top .hi{padding-top:7px!important;padding-bottom:6px!important}
 #stages .stage:nth-child(1){background:linear-gradient(145deg,#fff5ee,#fff)!important;border-color:#ffd0b7!important}#stages .stage:nth-child(2){background:linear-gradient(145deg,#eef6ff,#fff)!important;border-color:#c8e0ff!important}#stages .stage:nth-child(3){background:linear-gradient(145deg,#effcf8,#fff)!important;border-color:#c4ebdf!important}#stages .stage:nth-child(1) .price{color:#ee4d2d!important}#stages .stage:nth-child(2) .price{color:#1768bd!important}#stages .stage:nth-child(3) .price{color:#07866f!important}
 .shopee-head{display:flex;align-items:center;gap:10px}.shopee-logo{width:44px;height:44px;flex:0 0 auto}.training-included{margin-top:16px;border:2px solid #ff6419;background:#fff8ef;border-radius:18px;padding:15px}.training-included b{display:block;color:#e85c16;font-size:18px}.training-included span{display:block;color:#4b5d72;font-size:14px;line-height:1.45;margin-top:4px}.train-jump,.usecase-jump{display:inline-flex;margin-top:10px;border-radius:999px;padding:9px 12px;color:#fff!important;font-weight:900;font-size:13px;text-decoration:none!important}.train-jump{background:#ff6419}.usecase-jump{background:#0b3f82}.usecase-box{margin-top:16px;border:2px solid #2f7fd0;background:#eef6ff;border-radius:18px;padding:15px}.usecase-box b{display:block;color:#0b3f82;font-size:18px}.usecase-box p{font-size:14px;line-height:1.45;color:#44566c;margin:5px 0 0}.live-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#10a56c;margin-right:6px}
 @media(max-width:520px){.brand{grid-template-columns:38px 1px minmax(0,1fr) auto!important}.otop{width:38px!important;height:38px!important}.v{height:30px!important}.brand>.bt{font-size:12px!important}.brand>.pow{font-size:8px!important}.shopee-logo{width:38px;height:38px}.training-included b,.usecase-box b{font-size:17px}.training-included span,.usecase-box p,.train-jump,.usecase-jump{font-size:13px}}
 `;d.head.appendChild(st);
 const brand=d.querySelector('.brand');if(brand){const info=brand.children[2];if(info){const bt=info.querySelector('.bt'),pow=info.querySelector('.pow');if(bt&&pow){brand.appendChild(bt);brand.appendChild(pow);info.remove();}}}
 const stages=d.querySelectorAll('#stages .stage');
 const s1=stages[0];if(s1){const h=s1.querySelector('h3');if(h&&!s1.querySelector('.shopee-head')){const box=d.createElement('div');box.className='shopee-head';box.innerHTML='<svg class="shopee-logo" viewBox="0 0 64 64" aria-label="Shopee"><path fill="#ee4d2d" d="M15 20h34l-3 36H18L15 20z"/><path fill="none" stroke="#ee4d2d" stroke-width="5" stroke-linecap="round" d="M23 21c0-10 4-15 9-15s9 5 9 15"/><text x="32" y="47" text-anchor="middle" font-family="Arial" font-size="25" fill="white">S</text></svg>';h.parentNode.insertBefore(box,h);box.appendChild(h);}if(!s1.querySelector('.training-included')){const box=d.createElement('div');box.className='training-included';box.innerHTML='<b>✓ รวมการอบรมใน Stage 1 / Training Included</b><span>Workshop 1 วัน / 6 ชั่วโมง • รองรับ 300–500 คนต่อรุ่น</span><a class="train-jump" href="#train">ดูรายละเอียดการอบรม / View Training Details →</a>';s1.appendChild(box);}}
 const s2=stages[1];if(s2&&!s2.querySelector('.usecase-box')){const box=d.createElement('div');box.className='usecase-box';box.innerHTML='<b><span class="live-dot"></span>Live Technology Use Case: ครัวทองแดง</b><p>ตัวอย่าง HERO FastPage™ สำหรับร้านอาหาร: ข้อมูลร้าน เมนู รูปภาพ รีวิว แผนที่ และ 5 ภาษา</p><a class="usecase-jump" href="../krua-thong-daeng/">ดูตัวอย่างครัวทองแดง / Open Live Use Case →</a>';s2.appendChild(box);}
 const th=d.querySelector('#train h2');if(th)th.innerHTML='Stage 1 — รายละเอียดการอบรม <small>Stage 1 Training Details / Recommended training model</small>';
}catch(e){console.error(e)}});
</script></body></html>
