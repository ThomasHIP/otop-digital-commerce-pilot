<title>OTOP → HERO FastPage™ Pilot</title><style>
:root{--accent:#f28a22;--accent2:#b95a19;--bg:#fffaf4;--panel:#fff;--soft:#fff0df;--line:#eadfd4;--ink:#1e1d1a;--muted:#716d68;--shadow:0 12px 30px rgba(55,35,15,.10)}
body[data-lang="th"]{--accent:#f28a22;--accent2:#b95a19;--bg:#fffaf4;--soft:#fff0df}
body[data-lang="en"]{--accent:#35bfc8;--accent2:#26727a;--bg:#f4fcfd;--soft:#e7f8f9}
body[data-lang="zh"]{--accent:#d95b7b;--accent2:#914158;--bg:#fff7fa;--soft:#fde8ef}
body[data-lang="ja"]{--accent:#b96ca0;--accent2:#765176;--bg:#fdf8fc;--soft:#f6e8f2}
body[data-lang="ko"]{--accent:#68b9b2;--accent2:#2d6e69;--bg:#f4fcfb;--soft:#e7f6f4}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:"Noto Sans Thai","Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink)}a{text-decoration:none;color:inherit}button{font:inherit;cursor:pointer}.wrap{max-width:1180px;margin:auto;padding:0 18px}
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid #eee}.top .wrap{display:flex;align-items:center;gap:14px;min-height:72px;flex-wrap:wrap}.brand{font-size:26px;font-weight:900}.brand b{color:#f26922}.brand span{color:#214a84}.langs{margin-left:auto;display:flex;gap:7px;overflow:auto}.langs button{border:1px solid #ddd;background:#fff;padding:9px 13px;border-radius:999px;font-weight:800;white-space:nowrap}.langs button.active{background:var(--accent);color:white;border-color:var(--accent)}
.hero{padding:54px 0;background:linear-gradient(135deg,var(--soft),#fff)}.hero h1{font-size:48px;line-height:1.05;margin:0 0 12px}.hero p{font-size:19px;color:var(--muted);max-width:850px;line-height:1.6}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.chip{background:white;border:1px solid var(--line);padding:8px 12px;border-radius:999px;font-weight:800;color:var(--accent2)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;padding:36px 0 56px}.card{background:white;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}.card img{width:100%;height:210px;object-fit:cover;background:#eee}.card .pad{padding:17px}.eyebrow{font-size:12px;font-weight:900;color:var(--accent2);text-transform:uppercase;letter-spacing:.08em}.card h2{font-size:22px;line-height:1.25;margin:8px 0}.meta{font-size:14px;color:var(--muted);line-height:1.6}.price{font-size:22px;font-weight:900;color:var(--accent2);margin-top:10px}.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:14px;padding:12px 14px;font-weight:900;background:var(--accent);color:#fff}.btn.secondary{background:white;color:var(--accent2);border:1px solid var(--line)}.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.status{padding:6px 9px;border-radius:999px;font-weight:800;font-size:12px;display:inline-flex;margin-top:10px}.status.confirmed{background:#e8f7ed;color:#247141}.status.likely{background:#fff3d5;color:#8a5b00}.status.conflict{background:#ffe9e9;color:#9d2c2c}.status.unmatched{background:#edf0f3;color:#5b6269}
.section{padding:44px 0}.profile{display:grid;grid-template-columns:1fr 1.1fr;gap:22px}.heroimg{border-radius:24px;overflow:hidden;background:#eee;box-shadow:var(--shadow)}.heroimg img{width:100%;height:480px;object-fit:cover}.info{background:white;border:1px solid var(--line);border-radius:24px;padding:26px;box-shadow:var(--shadow)}.info h1{font-size:42px;line-height:1.1;margin:0 0 10px;color:var(--accent2)}.info .merchant{font-size:20px;font-weight:800;margin-bottom:12px}.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.fact{background:var(--soft);border-radius:16px;padding:14px}.fact b{display:block;color:var(--accent2);font-size:13px;margin-bottom:5px}.desc{font-size:18px;line-height:1.7;color:#555}.bar{height:10px;background:#eee;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}.googlebox{margin-top:18px;border:1px solid var(--line);border-radius:18px;padding:18px}.googlebox h3{margin:0 0 10px}.sourcebox{margin-top:18px;background:#fafafa;border:1px dashed #ccc;border-radius:18px;padding:16px;font-size:14px;word-break:break-all}.buybox{margin-top:20px;padding:20px;border-radius:20px;background:linear-gradient(135deg,var(--soft),#fff);border:1px solid var(--line)}.buybox h3{margin:0 0 8px;font-size:24px}.note{font-size:13px;color:var(--muted)}
footer{padding:24px 0;background:#15171a;color:#ddd;text-align:center}
@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.profile{grid-template-columns:1fr}.heroimg img{height:380px}}
@media(max-width:620px){
.hero h1{font-size:38px}
.grid{grid-template-columns:1fr}
.profile{grid-template-columns:1fr}
.heroimg img{height:330px}
.facts{grid-template-columns:1fr}
.info h1{font-size:34px}
.brand{font-size:22px}
.top .wrap{gap:10px;padding-top:10px;padding-bottom:10px}
.langs{
  width:100%;
  margin-left:0;
  padding:0;
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:6px;
  overflow:visible
}
.langs button{
  width:100%;
  min-width:0;
  padding:10px 3px;
  font-size:13px;
  line-height:1;
  text-align:center;
  white-space:nowrap
}
}
@media(max-width:390px){
.langs{gap:4px}
.langs button{padding:9px 2px;font-size:12px}
.brand{font-size:20px}
}

function home(){
 return `<section class="hero"><div class="wrap"><h1>${T[lang].title}</h1><p>${T[lang].subtitle}</p><div class="chips"><span class="chip">5 Regions</span><span class="chip">${T[lang].languages}</span><span class="chip">OTOP Source → Merchant Page</span><span class="chip">Google Match Verification</span><span class="chip">HERO PAY Ready</span></div></div></section>
 <div class="wrap"><div class="grid">${PRODUCTS.map(p=>`<article class="card"><img src="${p.image}" alt="${esc(p.names[lang])}" onerror="this.style.display='none'"><div class="pad"><div class="eyebrow">${regionText(p)} • ${esc(provinceText(p))}</div><h2>${esc(p.names[lang])}</h2><div class="meta">${esc(p.merchant_en)}</div><div class="price">${esc(localField(p,'price'))}</div><span class="status ${p.google_status}">${statusText(p)}</span><div class="actions"><button class="btn" onclick="openProduct('${p.id}')">${T[lang].view}</button><a class="btn secondary" target="_blank" rel="noopener" href="${p.source_url}">${T[lang].source}</a></div></div></article>`).join('')}</div></div>`;
}
function detail(p){
 const hasGoogle=p.google_rating;
 return `<section class="section"><div class="wrap"><button class="btn secondary" onclick="goHome()">${T[lang].back}</button><div class="profile" style="margin-top:18px"><div class="heroimg"><img src="${p.image}" alt="${esc(p.names[lang])}" onerror="this.style.display='none'"></div><div class="info"><div class="eyebrow">${regionText(p)} • ${esc(provinceText(p))}</div><h1>${esc(p.names[lang])}</h1><div class="merchant">${esc(p.merchant_th)} / ${esc(p.merchant_en)}</div><p class="desc">${esc(localField(p,'desc'))}</p><div class="facts"><div class="fact"><b>${T[lang].price}</b>${esc(localField(p,'price'))}</div><div class="fact"><b>${T[lang].category}</b>${esc(localField(p,'category'))}</div><div class="fact"><b>${T[lang].contact}</b>${esc(localField(p,'contact'))}</div><div class="fact"><b>${T[lang].address}</b>${esc(localField(p,'address'))}</div></div><div class="googlebox"><h3>${T[lang].google}</h3><span class="status ${p.google_status}">${statusText(p)}</span>${hasGoogle?`<p><b>${esc(p.google_title)}</b><br>⭐ ${p.google_rating} / 5 • ${p.google_reviews} ${T[lang].reviews}</p>`:''}<p class="note">${esc(p.google_note_th)}</p><div style="margin-top:12px"><b>${T[lang].confidence}: ${p.confidence}%</b><div class="bar"><i style="width:${p.confidence}%"></i></div></div></div><div class="sourcebox"><b>${T[lang].source}:</b><br><a target="_blank" rel="noopener" href="${p.source_url}">${p.source_url}</a><br>Product ID: ${p.source_id}</div><div class="buybox"><h3>🛒 ${T[lang].buy}</h3><p>${T[lang].demo}</p><button class="btn" onclick="alert(T[lang].demo)">HERO PAY Checkout Demo</button></div></div></div></div></section>`;
}
function openProduct(id){location.hash='product/'+id}
function goHome(){location.hash=''}
function render(){
 const h=location.hash.replace(/^#/,'');
 if(h.startsWith('product/')){const id=h.split('/')[1];const p=PRODUCTS.find(x=>x.id===id);document.getElementById('app').innerHTML=p?detail(p):home()}
 else document.getElementById('app').innerHTML=home();
 window.scrollTo(0,0);
}
window.addEventListener('hashchange',render);renderLangs();render();
</script></body></html>
